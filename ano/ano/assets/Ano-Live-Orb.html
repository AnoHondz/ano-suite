const orb=document.getElementById('ano'),status=document.getElementById('status'),sound=document.getElementById('sound');let audio,muted=false,laughing=false,timer;
function blink(){if(!laughing&&!document.hidden){orb.classList.add('blink');setTimeout(()=>orb.classList.remove('blink'),140)}timer=setTimeout(blink,2400+Math.random()*3600)}timer=setTimeout(blink,1800);
sound.onclick=()=>{muted=!muted;sound.textContent=muted?'Sound off':'Sound on ♫';sound.setAttribute('aria-pressed',String(!muted))};
function giggle(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio is unavailable in this browser.');audio??=new AC();return audio.resume().then(()=>{const start=audio.currentTime;[0,.15,.31,.49,.68].forEach((delay,i)=>{const t=start+delay,osc=audio.createOscillator(),harm=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='triangle';harm.type='sine';const pitch=[620,760,700,880,680][i];osc.frequency.setValueAtTime(pitch,t);osc.frequency.exponentialRampToValueAtTime(pitch*.75,t+.12);harm.frequency.setValueAtTime(pitch*1.5,t);filter.type='lowpass';filter.frequency.value=2200;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.12,t+.025);gain.gain.exponentialRampToValueAtTime(.001,t+.14);osc.connect(filter);harm.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(t);harm.start(t);osc.stop(t+.15);harm.stop(t+.15)})})}
orb.onclick=()=>{if(laughing)return;laughing=true;orb.classList.remove('blink');orb.classList.add('laugh');status.textContent='Hee-hee!';if(!muted)try{giggle().catch(()=>status.textContent='Sound unavailable — Ano is still smiling.')}catch{status.textContent='Sound unavailable — Ano is still smiling.'}setTimeout(()=>{orb.classList.remove('laugh');laughing=false;status.textContent=''},1350)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);audio?.suspend()}else{clearTimeout(timer);timer=setTimeout(blink,1500)}});
</script><style>
body{overflow:auto}.stage{padding:20px 0;width:min(88vw,470px)}.modes{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.modes button{border:1px solid #25496e;border-radius:18px;background:#0b192c;color:#a9c9ee;padding:8px 13px;font:12px system-ui;cursor:pointer}.modes button[aria-pressed=true]{background:#163b65;border-color:#79caff;color:#edf9ff}.speechbox{display:flex;gap:7px;margin:15px auto 0;max-width:400px}.speechbox input{min-width:0;flex:1;border:1px solid #25496e;border-radius:9px;background:#081423;color:#d1e8ff;padding:11px;font:12px system-ui}.speechbox button{border:1px solid #4278aa;background:#17416b;color:#def3ff;border-radius:9px;cursor:pointer;padding:8px 13px}.note{font-size:10px;color:#728da9;margin:12px 0;line-height:1.6}.talk-mouth{opacity:0;transform-box:fill-box;transform-origin:center}.speaking .mouth,.thinking .mouth,.confused .mouth{opacity:0}.speaking .talk-mouth{opacity:1;animation:talk .24s ease-in-out infinite alternate}.thinking .talk-mouth{opacity:1;transform:scale(.45,.23)}.thinking .eyes{animation:ponder 3s ease-in-out infinite}.thinking .swirl{animation-duration:7s}.thinking svg{filter:drop-shadow(0 0 35px #2c85d275)}.confused{animation:puzzled 2.8s ease-in-out infinite!important}.confused .eyes{transform:translate(5px,-3px) scaleY(.86)}.confused .talk-mouth{opacity:1;transform:scale(.45,.45)}.thinking .thoughts{opacity:1}.thoughts{opacity:0}.thoughts circle{animation:thought 1.5s ease-in-out infinite}.thoughts circle:nth-child(2){animation-delay:.2s}.thoughts circle:nth-child(3){animation-delay:.4s}.laugh .talk-mouth,.laugh .thoughts{opacity:0}.speaking.laugh .talk-mouth{opacity:0}.confused .brows{transform:rotate(-7deg);transform-origin:250px 195px}.confused .question{opacity:1}.question{opacity:0;font:500 38px system-ui;fill:#abdfff}.stateName{color:#9fc9ef;font-size:12px;min-height:18px;margin:8px 0}@keyframes talk{0%{transform:scale(1,.35)}35%{transform:scale(.7,1)}70%{transform:scale(1.1,.55)}100%{transform:scale(.8,1.15)}}@keyframes ponder{0%,100%{transform:translate(0,0)}35%,65%{transform:translate(10px,-8px)}}@keyframes puzzled{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-5px)}}@keyframes thought{50%{opacity:.25;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.speaking .talk-mouth{animation:none;transform:scale(.8,.8)}.confused,.thinking .eyes,.thoughts circle{animation:none!important}}
</style><script>
const face=orb.querySelector('.happy-mouth').parentNode;
face.querySelector('path').classList.add('brows');
face.insertAdjacentHTML('beforeend','<ellipse class="talk-mouth" cx="251" cy="301" rx="18" ry="15" fill="#020817" stroke="#b1e9ff" stroke-width="3"/><g class="thoughts" fill="#a7dfff"><circle cx="226" cy="309" r="4"/><circle cx="251" cy="309" r="4"/><circle cx="276" cy="309" r="4"/></g>');

document.querySelector('.hint').textContent='Tap Ano to giggle · Choose an expression below';
document.querySelector('.stage').insertAdjacentHTML('beforeend','<p class="stateName" id="stateName" role="status">Idle · ready when you are</p><div class="modes" aria-label="Preview Ano expressions"><button data-state="idle" aria-pressed="true">Idle</button><button data-state="speaking" aria-pressed="false">Speaking</button><button data-state="thinking" aria-pressed="false">Brainstorming</button><button data-state="confused" aria-pressed="false">Not understanding</button></div><div class="speechbox"><input id="sayText" aria-label="Text for Ano to speak" maxlength="1000" placeholder="Give Ano something to say…"><button id="say">Speak</button></div><p class="note">Expression previews · Voice uses your browser’s speech synthesis.<br>No AI service or microphone is connected.</p>');
let mode='idle',speechToken=0;
function setState(next,{cancelSpeech=true}={}){if(cancelSpeech){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}mode=next;orb.classList.remove('speaking','thinking','confused');if(next!=='idle')orb.classList.add(next);document.getElementById('stateName').textContent=({idle:'Idle · ready when you are',speaking:'Speaking · expression preview',thinking:'Brainstorming · expression preview',confused:'Not understanding · could you explain that another way?'})[next];document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===next)));orb.setAttribute('aria-label','Ano, '+next+'. Tap to giggle.');document.getElementById('say').textContent='Speak'}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setState(b.dataset.state));
document.getElementById('say').onclick=()=>{if(window.speechSynthesis?.speaking){setState('idle');return}const text=document.getElementById('sayText').value.trim()||'Hello! I’m Ano. Let’s work through your ideas together.';if(muted){status.textContent='Turn sound on to hear Ano speak.';return}if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable here. Try the Speaking expression preview.';return}setState('idle');const token=++speechToken;const utterance=new SpeechSynthesisUtterance(text);utterance.rate=.94;utterance.pitch=1.15;utterance.onstart=()=>{if(token!==speechToken)return;setState('speaking',{cancelSpeech:false});document.getElementById('say').textContent='Stop';document.getElementById('stateName').textContent='Speaking · browser voice'};utterance.onend=()=>{if(token===speechToken)setState('idle',{cancelSpeech:false})};utterance.onerror=()=>{if(token===speechToken){setState('idle',{cancelSpeech:false});status.textContent='Voice could not play. Expression previews still work.'}};speechSynthesis.speak(utterance)};
document.getElementById('sayText').onkeydown=e=>{if(e.key==='Enter')document.getElementById('say').click()};
const toggleSound=sound.onclick;sound.onclick=()=>{toggleSound();if(muted){setState('idle');audio?.suspend()}};
const originalTap=orb.onclick;orb.onclick=()=>{if(laughing)return;setState('idle');originalTap()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)setState('idle')});window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();audio?.suspend()});
// Integration boundary: a future assistant can call anoOrb.setState('thinking')
// or anoOrb.setState('confused'). These expressions do not imply AI is connected.
window.anoOrb={setState:s=>{if(['idle','speaking','thinking','confused'].includes(s))setState(s)},getState:()=>mode};
