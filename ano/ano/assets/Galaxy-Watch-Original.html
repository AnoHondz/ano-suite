<!doctype html><html><head><meta charset="utf-8"><title>ano.watch</title>
<!-- ano.watch: a slowly turning 3D nebula. Each part of Ano is a lobe of the cloud; a crawler (Ano's attention)
     crawls through it, reads each lobe and pins live facts on dotted tentacles. When a part is broken it spins
     silk over it while Ano's Supervisor does the real repair. Lobes come from Ano (ano/wallpaper_status.py);
     adding a station there adds a lobe here. Click a lobe for its card. The wallpaper only shows status. -->
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0a08}
#scene{position:absolute;left:50%;top:50%;width:1500px;height:1000px;transform-origin:center;background:radial-gradient(ellipse 65% 60% at 50% 50%,#1a1612 0%,#0c0a08 72%);font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
canvas{position:absolute;left:0;top:0;width:1500px;height:1000px}#bloom{filter:blur(7px);opacity:.75;mix-blend-mode:screen}
#card{position:absolute;width:300px;padding:12px 14px;background:#100e0bf5;border:1px solid #3a352f;color:#b8b1a6;font-size:11px;opacity:0;transform:translateY(6px);
 transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 10px 40px #000}
#card.open{opacity:1;transform:none;pointer-events:auto}
#card h1{margin:0;font-size:15px;letter-spacing:2px;color:#ece6dc}#card .role{color:#8a847a;margin:3px 0 9px}
#card .pill{display:inline-block;padding:1px 7px;font-size:9.5px;letter-spacing:1.5px;margin-bottom:8px;border:1px solid currentColor}
#card table{width:100%;border-collapse:collapse}#card td{padding:3px 0;border-top:1px solid #221f1b;vertical-align:top}#card td:first-child{color:#8a847a;width:42%}
#card .say{margin-top:9px;color:#8a847a}#card .say span{display:inline-block;margin:4px 4px 0 0;padding:1px 6px;background:#1a2a20;color:#5ee08f}
</style></head><body><div id="scene"><canvas id="bloom"></canvas><canvas id="web"></canvas><div id="card"></div></div>
<script>
(()=>{const W=1500,H=1000,scene=document.getElementById('scene'),canvas=document.getElementById('web'),ctx=canvas.getContext('2d'),bloomC=document.getElementById('bloom'),bctx=bloomC.getContext('2d'),card=document.getElementById('card');
const INK=[238,232,222],YEL=[232,212,77],PINK=[255,79,139],GREY=[95,88,80],GREEN=[94,224,143],TEAL=[45,170,160],LILAC=[214,190,220];
const rgb=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${Math.max(0,Math.min(1,a)).toFixed(3)})`,FONT=s=>`${s}px "JetBrains Mono","Cascadia Mono",Consolas,monospace`;
let S=1;function fit(){S=Math.max(innerWidth/W,innerHeight/H);const dpr=window.devicePixelRatio||1;scene.style.transform=`translate(-50%,-50%) scale(${S})`;
 canvas.width=Math.round(W*S*dpr);canvas.height=Math.round(H*S*dpr);ctx.setTransform(S*dpr,0,0,S*dpr,0,0);bloomC.width=W/2;bloomC.height=H/2;bctx.setTransform(.5,0,0,.5,0,0)}
fit();addEventListener('resize',fit);
let seed=23;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const g3=()=>(rnd()+rnd()+rnd()-1.5)/1.5;
// Each department keeps its own colour; health shows on top of it (grey when broken or silent, brighter when live).
const DEPT={scorpred:[255,154,92],forex:[72,214,234],stocks:[180,140,255],system:[139,224,164],mail:[240,207,110],assistant:[127,157,255]};
function deptColour(id){if(DEPT[id])return DEPT[id];let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))%360;
 const f=n=>{const k=(n+h/30)%12;return Math.round(255*(.62-.3*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}  // new departments: a stable hue of their own
const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];
const broken=s=>s&&s.state!=='healthy';
function colourOf(s){if(!s)return INK;const c=deptColour(s.id);return s.state==='healthy'?(s.active?mix(c,[255,255,255],.3):c):s.state==='stale'?GREY:mix(c,GREY,.7)}

// ── Camera ────────────────────────────────────────────────────────────────────────────────
// A chase camera: it rides just behind and above the crawler, turns to face where it is heading, and follows it in.
const cam={yaw:.3,pitch:-.3,F:900,D:600,cx:750,cy:565,f:{x:0,y:0,z:0}};  // a little further back than before, so the cloud breathes
// mouse parallax: the view leans a little toward the pointer (only if Lively passes the mouse through)
const par={x:0,y:0,tx:0,ty:0};addEventListener('mousemove',e=>{par.tx=(e.clientX/innerWidth-.5)*.22;par.ty=(e.clientY/innerHeight-.5)*.1});
function proj(p){const yw=cam.yaw+par.x,pt=cam.pitch+par.y,cy=Math.cos(yw),sy=Math.sin(yw),cp=Math.cos(pt),sp=Math.sin(pt),dx=p.x-cam.f.x,dy=p.y-cam.f.y,dz=p.z-cam.f.z;
 const x=dx*cy-dz*sy,z0=dx*sy+dz*cy,y=dy*cp-z0*sp,z=dy*sp+z0*cp,den=cam.F+z+cam.D;
 if(den<90)return {x:-9999,y:-9999,k:0,z:9999,hidden:true};  // behind the camera
 const k=cam.F/den;return {x:cam.cx+x*k,y:cam.cy+y*k,k,z}}
function steer(dt){const p=crawler.p,q=crawler.path[0],walking=crawler.phase==='walk'&&q;const e=1-Math.pow(.04,dt);
 cam.f.x+=(p.x-cam.f.x)*e;cam.f.y+=(p.y-cam.f.y)*e;cam.f.z+=(p.z-cam.f.z)*e;
 if(walking){const want=Math.atan2(q.x-p.x,q.z-p.z);let d=want-cam.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));cam.yaw+=d*(1-Math.pow(.6,dt))}
 else if(!openId)cam.yaw+=dt*.07;  // while reading, drift slowly round it
 cam.pitch=-.3+.07*Math.sin(performance.now()/9000);  // a slow rise and fall so the depth keeps reading
 const m=1-Math.pow(.2,dt);par.x+=(par.tx-par.x)*m;par.y+=(par.ty-par.y)*m}
const depth=q=>Math.max(0,Math.min(1,.5-q.z/800));
const FOG=[52,62,84],FLOOR=430;
// a floor of fine dots under the cloud, shrinking and fading with distance: depth without a boxy grid
function floorGrid(){const span=2400,gap=120;
 for(let x=-span;x<=span;x+=gap)for(let z=-span;z<=span;z+=gap){const q=proj({x,y:FLOOR,z});if(q.hidden||q.k>2.5)continue;
  const dp=depth(q),s=Math.max(.6,q.k*1.6);ctx.fillStyle=rgb(TEAL,.05+.32*dp*dp);ctx.fillRect(q.x-s/2,q.y-s/2,s,s)}}

// ── The nebula: one organic cloud, a lobe per part of Ano, filaments between, dust around ─────
let lobes=[],pts=[],links=[],built='',data=null,openId=null,grid=new Map();const CELL=42;
function near(p,r){const out=[],k=Math.ceil(r/CELL),bx=Math.floor(p.x/CELL),by=Math.floor(p.y/CELL),bz=Math.floor(p.z/CELL);
 for(let dx=-k;dx<=k;dx++)for(let dy=-k;dy<=k;dy++)for(let dz=-k;dz<=k;dz++)for(const j of grid.get(`${bx+dx},${by+dy},${bz+dz}`)||[]){const q=pts[j],d=Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z);if(d<=r)out.push([d,j])}return out}
function build(stations){built=stations.map(s=>s.id).join('|');seed=23;pts=[];links=[];grid=new Map();const n=stations.length;
 // lobes spread wide and at staggered heights so the cloud fills the whole screen
 lobes=stations.map((s,i)=>{const a=i/n*6.2832+.3;return {id:s.id,i,c:{x:Math.cos(a)*780+g3()*40,y:Math.sin(i*2.4+.6)*270+g3()*30,z:Math.sin(a)*330+g3()*40},pts:[],cut:[]}});
 const add=(p,r,b,m)=>{pts.push({x:p.x,y:p.y,z:p.z,r,b,m,lit:0,ph:rnd()*6.28});return pts.length-1};
 for(const g of lobes)for(let k=0;k<640;k++){const d=Math.pow(rnd(),1.5)*200,u=rnd()*6.2832,v=Math.acos(2*rnd()-1);
  g.pts.push(add({x:g.c.x+Math.sin(v)*Math.cos(u)*d*1.3,y:g.c.y+Math.cos(v)*d*.8,z:g.c.z+Math.sin(v)*Math.sin(u)*d},g.i,.3+rnd()*.6))}
 // filaments joining neighbouring lobes and the centre, blending one department's colour into the next
 lobes.forEach((g,i)=>{const nb=lobes[(i+1)%n];for(const h of [nb,{c:{x:0,y:0,z:0},i:-1}]){if(!h||h===g)continue;for(let k=0;k<170;k++){const u=rnd(),bow=Math.sin(u*Math.PI)*70;
  add({x:g.c.x+(h.c.x-g.c.x)*u+g3()*30,y:g.c.y+(h.c.y-g.c.y)*u+g3()*26-bow,z:g.c.z+(h.c.z-g.c.z)*u+g3()*30},-1,.18+rnd()*.35,[g.i,h.i,u])}}});
 for(let k=0;k<1800;k++){const r=200+Math.pow(rnd(),.6)*820,u=rnd()*6.2832,v=Math.acos(2*rnd()-1);add({x:Math.sin(v)*Math.cos(u)*r*1.45,y:Math.cos(v)*r*.85,z:Math.sin(v)*Math.sin(u)*r*.8},-3,.06+rnd()*.16)}
 pts.forEach((p,i)=>{const kk=`${Math.floor(p.x/CELL)},${Math.floor(p.y/CELL)},${Math.floor(p.z/CELL)}`;(grid.get(kk)||grid.set(kk,[]).get(kk)).push(i)});
 pts.forEach((p,i)=>{if(p.r===-3&&rnd()<.6)return;near(p,30).filter(([,j])=>j>i).sort((a,b)=>a[0]-b[0]).slice(0,1).forEach(([,j])=>links.push([i,j]))});
 for(const g of lobes)g.cut=links.map((l,k)=>[l,k]).filter(([[a,b]])=>pts[a].r===g.i&&pts[b].r===g.i).filter(()=>rnd()<.2).map(([,k])=>k);
 if(!crawler.started){crawler.p={...lobes[0].c};crawler.at=0;crawler.started=true}}

// ── The crawler ───────────────────────────────────────────────────────────────────────────
const crawler={p:{x:0,y:0,z:0},at:0,target:0,path:[],phase:'walk',since:0,trail:[],silk:[],tent:[],seen:new Map(),hd:0,legs:Array.from({length:8},(_,k)=>({k,foot:null,lift:0}))};
// Repairs come from Ano (ano/wallpaper_status.py repairs()): the crawler goes wherever Ano is fixing something and shows
// the real steps. It never acts itself; the Supervisor and overnight guard do the actual work.
const repairsAt=i=>((data&&data.repairs)||[]).filter(r=>data.stations[i]&&r.station===data.stations[i].id);
const jobKey=r=>[r.station,r.by,r.status,r.at||''].join('|');
const busyAt=i=>repairsAt(i).some(r=>r.status==='working');
function choose(){const st=data.stations,now=Date.now();
 const jobs=(data.repairs||[]).map(r=>[r,st.findIndex(s=>s.id===r.station)]).filter(([,i])=>i>=0);
 // a repair in progress comes first; then any repair it has not reported in the last five minutes
 const job=jobs.find(([r])=>r.status==='working')||jobs.find(([r])=>!(now-(crawler.seen.get(jobKey(r))||0)<300000));
 let next;if(job)next=job[1];else{const urgent=st.map((s,i)=>[s,i]).filter(([s])=>broken(s)||s.active).map(([,i])=>i);
  const pool=urgent.length&&Math.random()<.65?urgent:st.map((_,i)=>i);next=pool[(Math.random()*pool.length)|0];
  if(next===crawler.at&&st.length>1)next=(next+1+((Math.random()*(st.length-1))|0))%st.length}
 crawler.target=next;
 // a long wandering route: two or three waypoints deep in the cloud, joined by a smooth curve
 // a gently curving route: one or two waypoints with a small sideways drift, so it never doubles back on itself
 const a={...crawler.p},b=lobes[next].c,stops=[a,a];const hops=1+(Math.random()<.5?1:0),dist=Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z),side=(Math.random()-.5)*.35*dist;
 for(let h=1;h<=hops;h++){const u=h/(hops+1),bow=Math.sin(u*Math.PI)*side,nx=-(b.z-a.z)/(dist||1),nz=(b.x-a.x)/(dist||1);
  stops.push({x:a.x+(b.x-a.x)*u+nx*bow,y:a.y+(b.y-a.y)*u,z:a.z+(b.z-a.z)*u+nz*bow})}
 stops.push(b,b);crawler.path=[];
 for(let i=1;i<stops.length-2;i++){const [p0,p1,p2,p3]=[stops[i-1],stops[i],stops[i+1],stops[i+2]];  // Catmull-Rom through the waypoints
  for(let k=1;k<=30;k++){const t=k/30,t2=t*t,t3=t2*t,f=(a0,a1,a2,a3)=>.5*(2*a1+(-a0+a2)*t+(2*a0-5*a1+4*a2-a3)*t2+(-a0+3*a1-3*a2+a3)*t3);
   crawler.path.push({x:f(p0.x,p1.x,p2.x,p3.x),y:f(p0.y,p1.y,p2.y,p3.y),z:f(p0.z,p1.z,p2.z,p3.z)})}}
 crawler.phase='walk';crawler.silk=[];crawler.tent=[]}
function step(dt){let left=210*dt;const p=crawler.p;
 while(crawler.phase==='walk'&&left>0){const q=crawler.path[0];if(!q){arrive();break}const d=Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z);
  if(d<=left){Object.assign(p,q);crawler.path.shift();left-=d}else{p.x+=(q.x-p.x)/d*left;p.y+=(q.y-p.y)/d*left;p.z+=(q.z-p.z)/d*left;left=0}}
 crawler.trail.push({...p});if(crawler.trail.length>90)crawler.trail.shift();
 // gait: two alternating groups of four legs. A foot only steps on its group's turn, gliding in an arc to a spot
 // fanned around the way the crawler faces (a little ahead while walking, spread wider while reading).
 const walking=crawler.phase==='walk',reach=walking?60:85,ahead=crawler.path[0];
 if(walking&&ahead){const dx=ahead.x-p.x,dz=ahead.z-p.z,d=Math.hypot(dx,dz);if(d>1){crawler.fx=dx/d;crawler.fz=dz/d}}
 const fx=crawler.fx||1,fz=crawler.fz||0;let stepping=false;
 for(const leg of crawler.legs){const side=leg.k<4?-1:1,i=leg.k%4,a=[40,72,108,142][i]*Math.PI/180,ox=Math.cos(a),oy=side*Math.sin(a);
  const lead=walking?reach*.35:0,home={x:p.x+(fx*ox-fz*oy)*reach+fx*lead,y:p.y+14,z:p.z+(fz*ox+fx*oy)*reach+fz*lead};
  if(!leg.foot)leg.foot={...home};
  if(leg.step){const st=leg.step;st.u=Math.min(1,st.u+dt*7);const e=st.u*st.u*(3-2*st.u);
   leg.foot={x:st.from.x+(st.to.x-st.from.x)*e,y:st.from.y+(st.to.y-st.from.y)*e,z:st.from.z+(st.to.z-st.from.z)*e};
   leg.lift=Math.sin(Math.PI*st.u);if(st.u>=1)leg.step=null;else stepping=true}
  else{leg.lift=0;if((i+(side>0?1:0))%2===(crawler.gait||0)&&Math.hypot(leg.foot.x-home.x,leg.foot.y-home.y,leg.foot.z-home.z)>reach*.45){leg.step={from:{...leg.foot},to:home,u:0};stepping=true}}}
 if(!stepping)crawler.gait=crawler.gait?0:1;  // this group has landed: the other group's turn
 const s=data.stations[crawler.at],busy=busyAt(crawler.at);
 if(crawler.phase==='read'&&(broken(s)||busy)&&crawler.silk.length<30&&Math.random()<dt*7){const g=lobes[crawler.at];crawler.silk.push({to:pts[g.pts[(Math.random()*g.pts.length)|0]],u:0})}
 for(const w of crawler.silk)w.u=Math.min(1,w.u+dt*.9);for(const t of crawler.tent)t.u=Math.min(1,t.u+dt*1.6);
 // it stays with a repair in progress (up to a minute), a little longer at problems, ten seconds elsewhere
 if(crawler.phase==='read'&&performance.now()-crawler.since>(busy?60000:broken(s)||repairsAt(crawler.at).length?14000:10000))choose()}
// A fact is [name, value, kind]. kind: g = Ano fixing / fine, y = live or worth watching, p = needs you, w = plain reading.
function severity(name,value,kind){if(kind!=='w')return kind;const v=String(value).toLowerCase(),n=Number((v.match(/(\d+(?:\.\d+)?)%/)||[])[1]);
 if(/not running|not responding|not seen|offline|missing|stale|error|unavailable|failed/.test(v))return 'p';
 if(name==='ram'&&n>=92)return 'p';if(name==='ram'&&n>=80)return 'y';
 if(/battery/.test(v)&&n<25)return 'p';if(/battery/.test(v)&&n<50)return 'y';
 if(/degraded|no_games|none due/.test(v))return 'y';
 return /running|^on\b|watching|ready|\bok\b|sent|approved|available|all good|connected|listening/.test(v)?'g':'w'}  // plain readings stay neutral
function factsFor(i){const s=data.stations[i],facts=[];
 for(const r of repairsAt(i)){
  if(r.status==='working')facts.push(['ano is fixing',r.what,'g'],...r.steps.map(x=>['next step',x,'w']));
  else if(r.status==='needs-you')facts.push(['needs you',r.what,'p'],...r.steps.map(x=>{const m=String(x).match(/^([a-z ]{3,20}):\s*(.+)$/i);return m?[m[1],m[2],'w']:['what to do',x,'w']}));
  else facts.push(['fixed',r.what,'g'])}
 if(!facts.length){if(broken(s))facts.push(['problem',s.state==='stale'?'no signal':s.state,'p'],['repair',s.repair||'supervisor watching','g']);else if(s.active)facts.push(['live',String(s.headline),'y'])}
 s.details.forEach(([k,v])=>facts.push([k.toLowerCase(),String(v),'w']));
 return facts.slice(0,6).map(([n,v,k])=>[n,v.length>40?v.slice(0,39)+'…':v,severity(n,v,k)])}
// Facts hang in two tidy columns either side of the crawler: right column first, then left, top to bottom.
function tentacles(facts){const right=facts.filter((_,k)=>k%2===0),left=facts.filter((_,k)=>k%2===1);
 const place=(col,side)=>col.map((f,r)=>({fact:f,side,row:r,rows:col.length,u:0,delay:(r*2+(side<0?1:0))*.12}));
 return [...place(right,1),...place(left,-1)]}
function arrive(){crawler.phase='read';crawler.at=crawler.target;crawler.since=performance.now();
 for(const r of repairsAt(crawler.at))crawler.seen.set(jobKey(r),Date.now());crawler.tent=tentacles(factsFor(crawler.at))}

// ── Drawing ───────────────────────────────────────────────────────────────────────────────
let lastT=null,prevP=null;
function frame(ms){requestAnimationFrame(frame);if(lastT!==null&&ms-lastT<33)return;const dt=lastT===null?0:Math.min(.1,(ms-lastT)/1000);lastT=ms;
 ctx.clearRect(0,0,W,H);bctx.clearRect(0,0,W,H);if(!data||!lobes.length)return;const t=ms/1000,st=data.stations;
 step(dt);steer(dt);const P=pts.map(proj),reading=crawler.phase==='read',scan=reading?(performance.now()-crawler.since)/1000*160:-1;
 floorGrid();
 // each lobe glows from inside, larger when near: gives the cloud volume
 for(const g of lobes){const q=proj(g.c);if(q.hidden)continue;const r=Math.min(900,240*q.k),c=colourOf(st[g.i]),gr=bctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r);
  gr.addColorStop(0,rgb(c,.05+.14*depth(q)));gr.addColorStop(1,rgb(c,0));bctx.fillStyle=gr;bctx.fillRect(q.x-r,q.y-r,r*2,r*2)}
 // while it walks, the dust streaks past: each far point draws a short line from where it was a moment ago
 if(!reading&&prevP){ctx.lineWidth=.6;ctx.strokeStyle=rgb(INK,.06);ctx.beginPath();  // kept faint and sparse: a hint of speed, not noise
  for(let i=0;i<pts.length;i+=5){const a=prevP[i],b=P[i];if(a.hidden||b.hidden)continue;const d=Math.hypot(b.x-a.x,b.y-a.y);if(d>2.5&&d<60){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}}ctx.stroke()}
 prevP=P;
 // links, in three depth bands: far ones fade into the fog, near ones are brighter and thicker
 const bands=[[],[],[]];for(const [a,b] of links){const A=P[a],B=P[b];if(A.hidden||B.hidden)continue;const d=depth(A);bands[d<.35?0:d<.65?1:2].push(A,B)}
 [[.03,.4],[.07,.55],[.14,.8]].forEach(([al,lw],k)=>{const L=bands[k];ctx.lineWidth=lw;ctx.strokeStyle=rgb(INK,al);ctx.beginPath();
  for(let i=0;i<L.length;i+=2){ctx.moveTo(L[i].x,L[i].y);ctx.lineTo(L[i+1].x,L[i+1].y)}ctx.stroke()});
 for(const g of lobes){if(!broken(st[g.i]))continue;const mend=crawler.at===g.i&&reading?Math.min(1,(performance.now()-crawler.since)/12000):0;
  ctx.setLineDash([3,4]);ctx.strokeStyle=rgb(PINK,(.4+.25*Math.sin(t*9+g.i))*(1-mend));ctx.lineWidth=.9;ctx.beginPath();for(const k of g.cut){const [a,b]=links[k];if(P[a].hidden||P[b].hidden)continue;ctx.moveTo(P[a].x,P[a].y);ctx.lineTo(P[b].x,P[b].y)}ctx.stroke();ctx.setLineDash([])}
 // particles (also drawn into the half-size bloom layer for a soft glow)
 for(let i=0;i<pts.length;i++){const p=pts[i],q=P[i];if(q.hidden)continue;const dp=depth(q),s=p.r>=0?st[p.r]:null,dim=openId&&s&&openId!==s.id?.35:1;
