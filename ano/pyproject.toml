[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ano-desktop"
version = "0.1.10"
description = "A local-first Windows desktop assistant"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "anthropic>=0.75,<1", "keyring>=25,<26", "icalendar>=6,<7",
                "recurring-ical-events>=3,<4", "psutil>=6,<8", "openai>=2,<3", "youtube-transcript-api>=1,<2",
                "ddgs>=9,<10", "python-docx>=1.2,<2", "openpyxl>=3.1,<4", "reportlab>=4,<5", "pypdf>=6,<7",
                "python-dotenv>=1,<2"]

[project.optional-dependencies]
control = ["Pillow>=11,<13", "uiautomation>=2.0.29,<3; sys_platform == 'win32'"]
voice = ["vosk>=0.3.45,<0.4", "sounddevice>=0.5,<0.6", "pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
ano = "ano.app:main"

[tool.setuptools.packages.find]
include = ["ano", "ano.*"]

[tool.setuptools.package-data]
ano = ["qml/*.qml", "assets/*.ico", "assets/*.svg", "assets/*.png", "assets/*.wav", "assets/*.html", "assets/*.ps1", "assets/*.pptx","assets/fonts/*", "extension/*"]
